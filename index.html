    <script>
      (function () {
        try {
          var currentFetch =
            typeof window.fetch === 'function' ? window.fetch.bind(window) : undefined;
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var protoDesc =
            typeof Window !== 'undefined' && Window.prototype
              ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
              : undefined;

          if (currentFetch) {
            if (!ownDesc || (ownDesc.configurable && !ownDesc.writable && !ownDesc.set)) {
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return currentFetch;
                },
                set: function (nextFetch) {
                  if (typeof nextFetch === 'function') {
                    currentFetch = nextFetch;
                  }
                },
              });
            }
            if (
              protoDesc &&
              protoDesc.configurable &&
              !protoDesc.writable &&
              !protoDesc.set &&
              typeof Window !== 'undefined' &&
              Window.prototype
            ) {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return currentFetch;
                },
                set: function (nextFetch) {
                  if (typeof nextFetch === 'function') {
                    currentFetch = nextFetch;
                  }
                },
              });
            }
          }

          window.addEventListener(
            'error',
            function (event) {
              var file = (event && event.filename) || '';
              var msg = (event && event.message) || '';
              if (
                file.indexOf('chrome-extension://') === 0 ||
                msg.indexOf('Cannot set property fetch of #<Window>') !== -1
              ) {
                event.stopImmediatePropagation();
                event.preventDefault();
              }
            },
            true
          );
        } catch (_err) {
          // Ignore descriptor restrictions
        }
      })();
    </script>
